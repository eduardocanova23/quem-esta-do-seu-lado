# Roda antes de cada commit, só nos arquivos em staging. Instalado por `make setup`.
# É o aviso rápido na sua máquina; quem barra de verdade é o CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      # Dado não é texto para formatar: em 15/11/2026 o trailing-whitespace apagou espaços dentro de 26
      # ementas da amostra, no commit, sem ninguém ver. Dado só muda pelo gerador; fixture guarda os bytes da fonte.
      - id: end-of-file-fixer
        exclude: '^(db|pipeline/tests/fixtures)/.*\.(csv|json)$'
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(db|pipeline/tests/fixtures)/.*\.(csv|json)$'

  # Hooks locais: usam as versões do uv.lock e o gitleaks de scripts/instalar_gitleaks.sh,
  # as mesmas do `make ci`. Hooks remotos fixariam uma segunda versão de cada ferramenta.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: unsupported
        types_or: [python, pyi]
        pass_filenames: false
      - id: gitleaks
        name: gitleaks
        entry: .venv/bin/gitleaks git --pre-commit --redact --staged --verbose
        language: unsupported
        pass_filenames: false
