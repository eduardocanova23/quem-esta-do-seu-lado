name: ci

# Sem filtro de paths: um check obrigatório com filtro nunca roda nos PRs
# que não tocam aqueles caminhos e deixa o merge preso em "aguardando".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rota:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml==6.0.2
      - name: Valida docs/frentes.yaml
        run: python3 scripts/rota.py --check
