# Dependências e configuração das ferramentas Python. Por que uv: docs/decisoes/0001-ambiente-python-com-uv.md

[project]
name = "camara"
version = "0.0.0"
description = "Site que responde, em linguagem comum, o que a Câmara faz e quem está do seu lado"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv]
# O repositório não é um pacote instalável; o uv só cuida do ambiente.
package = false
# Único lugar com a versão do uv: o CI lê daqui.
required-version = "==0.13.7"

[tool.ruff]
line-length = 120
target-version = "py313"
# Onde estão os módulos do projeto, para separar os imports internos dos externos
src = ["scripts"]
# Só código Python: sem isto o ruff reformata também os blocos de código dentro dos .md de docs/
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# E/W estilo, F erros reais, I ordem dos imports, B armadilhas comuns, UP sintaxe moderna
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]
